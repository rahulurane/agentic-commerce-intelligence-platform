<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003b71" />
    <title>ACIP — Decision Intelligence</title>
    <script>
      // Set the theme before first paint (no flash). Light is the default and the OS
      // prefers-color-scheme is deliberately ignored.
      (function () {
        var theme = "light";
        try {
          if (window.localStorage.getItem("acip.theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
