[project]
name = "acip"
version = "0.1.0"
description = "Agentic Commerce Intelligence Platform (ACIP) — Phase 1 foundation layer"
requires-python = ">=3.11"
# The root project is a thin aggregator for the uv workspace; runtime code lives in
# the workspace members (libs/*) and in the standalone ml/ project.
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]
# Service dirs are still empty scaffolding (.gitkeep only); uv requires every
# matched member to carry a pyproject.toml. Exclude them until each Phase 2 FEAT
# adds that service's package, at which point its dir drops out of this list.
exclude = [
    "services/checkout-api",
    "services/checkout-personalization-agent",
    "services/commerce-orchestrator",
    "services/fraud-agent",
    "services/graph-projector",
    "services/merchant-agent",
    "services/policy-agent",
    "services/representation-service",
    "services/risk-agent",
    "services/routing-agent",
]

[tool.uv.sources]
acip-common = { workspace = true }
decision-engine = { workspace = true }
llm-gateway = { workspace = true }
ml-scoring-service = { workspace = true }
payment-processor-sim = { workspace = true }

[dependency-groups]
# Workspace-wide dev tooling plus the deps scripts/seed.py needs, so `make seed`
# and the lint/test gate all run under the single root virtualenv (plan item 9).
dev = [
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "acip-common",
    "neo4j==5.27.0",
    "psycopg[binary]==3.2.3",
    # Phase 2 service members, so a plain `uv sync` installs them into the dev env and
    # the `uv run pytest services` / mypy gate resolves their imports. Each remains an
    # independently buildable workspace package; this only wires them into dev tooling.
    "decision-engine",
    "llm-gateway",
    "ml-scoring-service",
    "payment-processor-sim",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["libs/acip-common/src", "ml", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# confluent-kafka ships no type stubs / py.typed marker.
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ML + GenAI SDKs ship no type stubs; ml-scoring imports xgboost/lightgbm and the
# llm-gateway Gemini adapter imports google.genai lazily.
module = [
    "xgboost",
    "xgboost.*",
    "lightgbm",
    "lightgbm.*",
    "google",
    "google.*",
]
ignore_missing_imports = true
