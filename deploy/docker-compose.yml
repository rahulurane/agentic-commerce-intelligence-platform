# ACIP local infrastructure stack — INFRASTRUCTURE ONLY (docs/07 §1).
# The 14 application services are built in a later phase; this file brings up the
# backing infra: Redpanda (Kafka API), topic init, Neo4j, Postgres, Redis, and the
# observability trio (Prometheus, Grafana, Jaeger). All on a private acip-net network.
name: acip

networks:
  acip-net:
    driver: bridge

volumes:
  redpanda-data:
  neo4j-data:
  postgres-data:
  redis-data:
  grafana-data:

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: acip-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092" # external Kafka API for local tooling
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - acip-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: acip-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in txn.lifecycle txn.evaluate agent.verdicts decision.log \
                 txn.lifecycle.dlq txn.evaluate.dlq agent.verdicts.dlq decision.log.dlq; do
          rpk topic create "$$t" --brokers redpanda:9092 || true
        done
        echo "topics ready"
    networks:
      - acip-net
    restart: "no"

  neo4j:
    image: neo4j:5
    container_name: acip-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
    networks:
      - acip-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: acip-postgres
    environment:
      POSTGRES_USER: acip
      POSTGRES_PASSWORD: acip
      POSTGRES_DB: acip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - acip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acip -d acip"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: acip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - acip-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # --- application services (Phase 2 core decision path, docs/07 §1) ---
  # Each builds from its service Dockerfile with the REPO ROOT as context so the
  # acip-common workspace lib is available to `uv sync`. All listen on container port
  # 8000 and stay internal to acip-net; ONLY checkout-api publishes a host port.
  payment-processor-sim:
    build:
      context: ..
      dockerfile: services/payment-processor-sim/Dockerfile
    container_name: acip-payment-processor-sim
    env_file:
      - path: ../.env
        required: false
    environment:
      SIM_APPROVAL_RATE: ${SIM_APPROVAL_RATE:-0.9}
      SIM_LATENCY_MS: ${SIM_LATENCY_MS:-40}
      SIM_FAILURE_MODE: ${SIM_FAILURE_MODE:-none}
    networks:
      - acip-net

  ml-scoring-service:
    build:
      context: ..
      dockerfile: services/ml-scoring-service/Dockerfile
    container_name: acip-ml-scoring-service
    env_file:
      - path: ../.env
        required: false
    environment:
      ML_MODELS_DIR: /app/ml/models
    volumes:
      # Trained artifacts are mounted read-only; the service discovers them via
      # model_card.json and falls back to a heuristic if absent (docs/05 §5).
      - ../ml/models:/app/ml/models:ro
    networks:
      - acip-net

  llm-gateway:
    build:
      context: ..
      dockerfile: services/llm-gateway/Dockerfile
    container_name: acip-llm-gateway
    env_file:
      - path: ../.env
        required: false
    environment:
      # No cloud creds in the default stack: the breaker degrades to the mock provider
      # (docs/04 §4) so the path runs credential-free.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-mock}
    networks:
      - acip-net

  decision-engine:
    build:
      context: ..
      dockerfile: services/decision-engine/Dockerfile
    container_name: acip-decision-engine
    env_file:
      - path: ../.env
        required: false
    environment:
      MISSING_RISK_FRAUD_POLICY: ${MISSING_RISK_FRAUD_POLICY:-CHALLENGE}
    networks:
      - acip-net

  representation-service:
    build:
      context: ..
      dockerfile: services/representation-service/Dockerfile
    container_name: acip-representation-service
    env_file:
      - path: ../.env
        required: false
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - acip-net

  commerce-orchestrator:
    build:
      context: ..
      dockerfile: services/commerce-orchestrator/Dockerfile
    container_name: acip-commerce-orchestrator
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://acip:acip@postgres:5432/acip}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REPRESENTATION_URL: http://representation-service:8000
      DECISION_ENGINE_URL: http://decision-engine:8000
      PAYMENT_PROCESSOR_URL: http://payment-processor-sim:8000
      DECISION_DEADLINE_MS: ${DECISION_DEADLINE_MS:-800}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      representation-service:
        condition: service_started
      decision-engine:
        condition: service_started
      payment-processor-sim:
        condition: service_started
    networks:
      - acip-net

  checkout-api:
    build:
      context: ..
      dockerfile: services/checkout-api/Dockerfile
    container_name: acip-checkout-api
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://acip:acip@postgres:5432/acip}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORCHESTRATOR_URL: http://commerce-orchestrator:8000
    ports:
      - "8080:8000" # the ONLY publicly published app port
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-orchestrator:
        condition: service_started
    networks:
      - acip-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: acip-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - acip-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: acip-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000" # dashboards UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - acip-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: acip-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # trace UI
      - "4317:4317" # OTLP gRPC
    networks:
      - acip-net
