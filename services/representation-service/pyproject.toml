[project]
name = "representation-service"
version = "0.1.0"
description = "ACIP representation-service: builds the shared transaction representation (docs/03 §8)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    # neo4j pinned to match the root dev group / scripts/seed.py; redis for hot features.
    "neo4j==5.27.0",
    "redis==5.2.1",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/representation_service"]
