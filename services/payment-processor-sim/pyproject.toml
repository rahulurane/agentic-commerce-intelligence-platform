[project]
name = "payment-processor-sim"
version = "0.1.0"
description = "ACIP payment-processor-sim: config-driven simulated charge service (docs/06 §2)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_processor_sim"]
