[project]
name = "graph-projector"
version = "0.1.0"
description = "ACIP graph-projector: projects lifecycle/verdict/decision events into Neo4j + Postgres read models (docs/03 §3-4)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "neo4j==5.27.0",
    "psycopg[binary]==3.2.3",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_projector"]
