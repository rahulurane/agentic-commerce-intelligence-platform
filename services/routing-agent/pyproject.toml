[project]
name = "routing-agent"
version = "0.1.0"
description = "ACIP routing-agent: candidate-route scoring + ranking (docs/02 §3.1)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "acip-agent-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
]

[tool.uv.sources]
acip-common = { workspace = true }
acip-agent-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing_agent"]
