[project]
name = "decision-engine"
version = "0.1.0"
description = "ACIP decision-engine: verdict aggregation to a final decision (docs/02 §5)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]
