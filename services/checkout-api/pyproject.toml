[project]
name = "checkout-api"
version = "0.1.0"
description = "ACIP checkout-api: public checkout edge, idempotency, read models (docs/06 §1)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "redis==5.2.1",
    "psycopg[binary]==3.2.3",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_api"]
