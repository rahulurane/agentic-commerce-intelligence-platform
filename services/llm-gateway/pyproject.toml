[project]
name = "llm-gateway"
version = "0.1.0"
description = "ACIP llm-gateway: provider-agnostic completion gateway with fallback (docs/04)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Google GenAI/Vertex SDK is optional: imported lazily inside GeminiAdapter so the
# package imports (and the stack runs on the mock provider) without it or any creds.
gemini = ["google-genai==1.0.0"]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
