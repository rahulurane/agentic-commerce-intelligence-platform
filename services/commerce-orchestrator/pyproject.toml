[project]
name = "commerce-orchestrator"
version = "0.1.0"
description = "ACIP commerce-orchestrator: LangGraph evaluation graph + sync trigger (docs/02 §2.1)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "langgraph==0.2.60",
    "redis==5.2.1",
    "psycopg[binary]==3.2.3",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_orchestrator"]
