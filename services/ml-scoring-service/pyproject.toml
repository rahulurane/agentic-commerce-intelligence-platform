[project]
name = "ml-scoring-service"
version = "0.1.0"
description = "ACIP ml-scoring-service: risk/fraud scoring with heuristic fallback (docs/05)"
requires-python = ">=3.11"
dependencies = [
    "acip-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    # Pinned to match ml/pyproject.toml so serve-time artifacts load identically.
    "xgboost==2.1.3",
    "lightgbm==4.5.0",
    "numpy==2.1.3",
]

[tool.uv.sources]
acip-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_scoring_service"]
